# Test profile — uses the same local PostgreSQL DB as development
# The concurrency tests require a real DB connection for row-level locking to work.
spring.datasource.url=jdbc:postgresql://localhost:5432/gemhaven_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Let Hibernate create/update tables for tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable scheduling during tests to prevent AuctionSchedulerService from
# interfering with test auction state (e.g. auto-closing our test auctions)
spring.task.scheduling.pool.size=0

# JWT config (same as main — tests may need it for Spring context startup)
app.jwt.secret=gemhaven-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algo
app.jwt.expiration-ms=86400000

# Admin credentials (required for AdminSeeder on startup)
app.admin.email=admin@gemhaven.com
app.admin.password=admin123
