spring.application.name=gemhaven-backend

# PostgreSQL Connection settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.format-sql=true

# Hibernate manages DDL — schema.sql is archived
spring.jpa.hibernate.ddl-auto=update

# Do NOT execute schema.sql on startup (Hibernate handles table creation/alteration)
spring.sql.init.mode=never

# Scheduling (for AuctionScheduler)
spring.task.scheduling.pool.size=2

# JWT config
app.jwt.secret=gemhaven-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algo
app.jwt.expiration-ms=86400000

# Admin user predefined credentials
app.admin.email=${ADMIN_EMAIL:admin@gemhaven.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
